# ----
# Site

title: CTI Butler
url: "https://www.ctibutler.com"
baseurl: 

# Do not publish future blog posts or drafts
future: false
show_drafts: false

description: CTI Context for AI Agents. The most important cyber threat intelligence knowledgebases accessible in a single platform.
tagline: CTI context for analysts, engineers, and AI agents
og_image: /assets/images/global/og-image.png
author:
  name: dogesec

company_data:
  name: dogesec
  legal_name: Do Only Good Everyday Security
  url: https://www.dogesec.com
  logo: /assets/images/global/doge-outline-pink-bg.png
  same_as:
    - https://github.com/muchdogesec
    - https://www.linkedin.com/company/dogesec
    - https://www.youtube.com/@muchdogesec

product_data:
  name: CTI Butler
  application_category: SecurityApplication
  operating_system: Web browser
  application_sub_category: Cyber Threat Intelligence Knowledge Base Platform
  url: https://www.ctibutler.com
  source_code_url: https://github.com/muchdogesec/ctibutler
  sign_up_url: https://app.ctibutler.com
  api_reference_url: https://api.ctibutler.com/schema/swagger-ui/
  taxii_api_reference_url: https://taxii.ctibutler.com/schema/swagger-ui/
  description: CTI Butler gives teams and AI agents structured access to major cyber threat intelligence knowledge bases, linked context, and interoperable outputs through search, APIs, and standards-based exports.
  feature_list:
    - Unified access to major CTI knowledge bases
    - Search and retrieval across ATT&CK, CAPEC, CWE, ATLAS, DISARM, and related datasets
    - Technique inference and attack-path context
    - Linked real-world context including reports, blogs, and vulnerabilities
    - REST API, TAXII API, STIX bundle export, and ATT&CK Navigator layers
    
    
# -----
# Build

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

timezone: "Europe/London"

defaults:
  -
    scope:
      path: ""
    values:
      layout: "page"
  -
    scope:
      path: "index.html"
    values:
      layout: "default"
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - tmp
  - LICENCE
  - gulpfile.js
  - package.json
  - package-lock.json
  - node_modules

